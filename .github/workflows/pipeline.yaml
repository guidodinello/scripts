name: Code Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7

          - name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
                enable-cache: true
                cache-dependency-glob: "uv.lock"

          - name: "Set up Python"
            uses: actions/setup-python@v7
            with:
              python-version-file: ".python-version"

          - name: Create virtual environment and install dependencies
            run: |
              uv venv .venv
              source .venv/bin/activate
              uv pip install -e ".[dev]"

          - name: Run quality checks
            run: |
              source .venv/bin/activate
              make format-check
              make lint
              make test

    # Single stable check name for the branch ruleset (see dev-standards
    # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
    # needed job fails; a skipped required check would count as passing.
    ci:
        name: CI
        needs:
          - quality
        if: always()
        runs-on: ubuntu-latest
        steps:
          - name: Check results
            env:
              RESULTS: ${{ join(needs.*.result, ' ') }}
            run: |
              read -ra results <<< "$RESULTS"
              for r in "${results[@]}"; do
                if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
                  echo "A required job finished as: $r"
                  exit 1
                fi
              done
