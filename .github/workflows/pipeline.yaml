name: Code Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7

          - name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
                enable-cache: true
                cache-dependency-glob: "uv.lock"

          - name: "Set up Python"
            uses: actions/setup-python@v7
            with:
              python-version-file: ".python-version"

          - name: Create virtual environment and install dependencies
            run: |
              uv venv .venv
              source .venv/bin/activate
              uv pip install -e ".[dev]"

          - name: Run quality checks
            run: |
              source .venv/bin/activate
              make format-check
              make lint
              make test
          # Hook envs live in ~/.cache/pre-commit, outside setup-uv's cache.
          # pre-commit rebuilds an env whose interpreter has since changed.
          - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: ~/.cache/pre-commit
              key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          # Runs the whole .pre-commit-config.yaml so the hygiene hooks gate merges
          # too. The venv must be active: pylint is a `language: system` hook.
          - name: pre-commit hooks
            run: |
              source .venv/bin/activate
              pre-commit run --all-files --show-diff-on-failure

    # Single stable check name for the branch ruleset (see dev-standards
    # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
    # needed job fails; a skipped required check would count as passing.
    ci:
        name: CI
        needs:
          - quality
        if: always()
        runs-on: ubuntu-latest
        steps:
          - name: Check results
            env:
              RESULTS: ${{ join(needs.*.result, ' ') }}
            run: |
              read -ra results <<< "$RESULTS"
              for r in "${results[@]}"; do
                if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
                  echo "A required job finished as: $r"
                  exit 1
                fi
              done
