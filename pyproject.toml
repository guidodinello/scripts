[project]
name = "scripts"
version = "0.1.0"
description = "Collection of general tasks automation scripts"
authors = [{ name = "Guido Dinello", email = "guido.dinello@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pylint>=3.3.6",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Compiled as a pure extension module (no python-source) — imported
# directly as `import fuzzy_string_matcher` (see utils/sfm.py), not
# wrapped in a matching Python package. python-source = "." previously
# forced maturin's mixed-layout mode, which requires a companion
# fuzzy_string_matcher/__init__.py that was never meant to exist —
# broke every build since it was added.
module-name = "fuzzy_string_matcher"
# Specify the Rust manifest location
manifest-path = "rust_utils/fuzzy_string_matcher/Cargo.toml"
# Include Python packages (list of package names, not paths)
python-packages = ["cheatsheet", "open", "organize", "utils"]
