[project]
name = "scripts"
version = "0.1.0"
description = "Collection of general tasks automation scripts"
authors = [{ name = "Guido Dinello", email = "guido.dinello@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["logger"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "black>=26.5.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.8",
]

[tool.uv.sources]
# Git source, not a local path: the old absolute path only resolved on this
# machine, which is exactly what .github/workflows/pipeline.yaml needs to
# resolve too. uv.lock pins the exact resolved commit, but that pin is only
# enforced by `uv sync --locked`/`--frozen`; a plain `uv sync` prefers the
# locked commit over the branch's latest, so it won't silently pick up new
# commits. Tracks logger's main branch; bump with
# `uv lock --upgrade-package logger` when logger changes and you want the
# update here.
logger = { git = "https://github.com/guidodinello/logger", branch = "main" }

[[tool.mypy.overrides]]
# The logger package ships no py.typed marker/stubs yet.
module = "logger"
ignore_missing_imports = true

[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Compiled as a pure extension module (no python-source) — imported
# directly as `import fuzzy_string_matcher` (see utils/sfm.py), not
# wrapped in a matching Python package. python-source = "." previously
# forced maturin's mixed-layout mode, which requires a companion
# fuzzy_string_matcher/__init__.py that was never meant to exist —
# broke every build since it was added.
module-name = "fuzzy_string_matcher"
# Specify the Rust manifest location
manifest-path = "rust_utils/fuzzy_string_matcher/Cargo.toml"
# Include Python packages (list of package names, not paths)
python-packages = ["cheatsheet", "open", "organize", "utils"]
